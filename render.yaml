services:
  - type: web
    name: punjab-esports-push-server
    runtime: node
    plan: free
    rootDir: push-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://punjab-turnaments-default-rtdb.asia-southeast1.firebasedatabase.app
