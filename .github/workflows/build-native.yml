name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK and accept licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK/licenses/android-sdk-preview-license"
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_SDK" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK and Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Prepare output files
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Punjab-Esports-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/Punjab-Esports-release.aab
          ls -lh release-assets/

      - name: Upload GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Punjab-Esports-Android-Build
          if-no-files-found: error
          path: release-assets/*

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG" \
            release-assets/Punjab-Esports-debug.apk \
            release-assets/Punjab-Esports-release.aab \
            --title "Punjab Esports Android Build #${{ github.run_number }}" \
            --notes "Automatic Android build from commit ${{ github.sha }}. Download Punjab-Esports-debug.apk to install on your phone, or Punjab-Esports-release.aab for Google Play Console." \
            --latest
